# ----------------- Essential Site Information -----------------
# These are the core details about your blog.
title: 周六不上发条🌕 # The main title of your blog, appears in the browser tab.
subtitle: ' Journey into Tech and Creativity' # A short, catchy subtitle.
description: 'This blog explores topics in integrated circuit , photography , design , and fitness training .' # A brief description for search engines.
keywords: 'ic, tech, design, photography ' # Keywords for SEO.
author: LEEcDiang # Your name.
language: zh-CN # Language of your site (e.g., en, zh-CN).
timezone: Asia/Shanghai # Your timezone, find yours here: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# ----------------- URL Structure -----------------
# This is crucial for how links to your site and posts will look.
# If you are using GitHub Pages, it should be: https://<Your-GitHub-Username>.github.io
# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://leecdiang.github.io/myblog-source
root: /myblog-source/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true 
  trailing_html: true
# ----------------- Theme -----------------
# Set the theme you installed. 'next' is a very popular choice.
theme: next

# ----------------- Deployment -----------------
# This section configures how you deploy your blog to the web.
# The following is a standard setup for GitHub Pages.
deploy:
  type: git
  repo: https://github.com/leecdiang/myblog-source.git
  branch: gh-pages

# --- The rest of the settings are standard and usually don't need changes to start ---

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# Syntax Highlighting
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

live2d:
  enable: true
  scriptFrom: local
  pluginRootPath: live2dw/
  pluginJsPath: lib/
  pluginModelPath: assets/
  tagMode: false
  log: false
  model:
    use: live2d-widget-model-hijiki
  display:
    position: right
    width: 150
    height: 300
  mobile:
    show: true
