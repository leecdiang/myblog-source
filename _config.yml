# ----------------- Essential Site Information -----------------
# These are the core details about your blog.
title: Beyond the Clock # The main title of your blog, appears in the browser tab.
subtitle: 'Tracing systems inside and beyond the clock.'
description: 'Beyond the Clock — LEEcDiang personal archive on microelectronics, digital IC, computer architecture, AI infrastructure, tools, and visual narratives.' # A brief description for search engines.
keywords: 'ic, tech, design, photography ' # Keywords for SEO.
author: LEEcDiang # Your name.
language: en # Language of your site (e.g., en, zh-CN).
timezone: Asia/Shanghai # Your timezone, find yours here: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# ----------------- URL Structure -----------------
# This is crucial for how links to your site and posts will look.
# If you are using GitHub Pages, it should be: https://<Your-GitHub-Username>.github.io
# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://leecdiang.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true 
  trailing_html: true
# ----------------- Theme -----------------
# Set the theme you installed. 'next' is a very popular choice.
theme: next

# ----------------- Deployment -----------------
# This section configures how you deploy your blog to the web.
# The following is a standard setup for GitHub Pages.
deploy:
  type: git
  repo: https://github.com/leecdiang/leecdiang.github.io.git
  branch: main
  ignore_hidden: false

# --- The rest of the settings are standard and usually don't need changes to start ---

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - "*.txt"

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# Syntax Highlighting
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: '/intro/'
  per_page: 10
  order_by: -date

# Archive — 关闭分页，全部文章在一个连续时间轴中展示
archive_generator:
  per_page: 0
  yearly: true
  monthly: false

# Category & Tag
default_category: uncategorized
#category_map:

# Disable word count / reading time (臃肿)
symbols_count_time:
  symbols: false
  time: false
  total_symbols: false
  total_time: false
#tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

live2d:
  enable: true
  scriptFrom: local
  pluginRootPath: live2dw/
  pluginJsPath: lib/
  pluginModelPath: assets/
  tagMode: false
  log: false
  model:
    use: live2d-widget-model-hijiki
  display:
    position: right
    width: 150
    height: 300
  mobile:
    show: true


marked:
  prependRoot: true
  postAsset: true

# 这是 _config.yml (根目录)

# ... 其他配置 ...

# 确保插件知道在哪里生成页面
category_generator:
  path: categories
  per_page: 10 # 默认是 10
  order_by: -date


# hexo-admin authentification
admin:
  username: LCZ
  password_hash: $2a$10$VfzCjQaCyfPpKhl5heR8CurgCrQJO/fBhYXIjaK/H9og0qlENegdG
  secret: ECHO


# Markdown-it 配置
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: true
    quotes: '“”‘’'
  plugins:
    - markdown-it-mark # 这行就是让 == 生效的关键


# Sitemap 配置
sitemap:
  path: sitemap.xml
  template: ./sitemap-template.xml
  rel: false
  tags: false
  categories: false

# Baidu 站点地图（附赠 SEO，Google 也可用）
baidusitemap:
  path: baidusitemap.xml
  url: https://leecdiang.github.io

# Atom Feed（Google Search Console 可接受）
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 0
  order_by: -date
  icon: /images/avatar.png
  autodetect: false


# IndexNow 自动提交（Bing / Yandex 等）
indexnow:
  enable: true
  key: "f3d4d23e6edb425b8bc639efacb24f70"
  keyLocation: "https://leecdiang.github.io/myblog-source/f3d4d23e6edb425b8bc639efacb24f70.txt"

