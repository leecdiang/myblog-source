<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 356" role="img" aria-label="Four positions in a recurrent or a causal attention layer" style="min-width:0;max-width:560px;margin-inline:auto;font-variant-numeric:tabular-nums" font-family="system-ui, sans-serif">
  <title>Four positions in a recurrent or a causal attention layer</title>
  <desc>Each recurrent state depends on its predecessor and its input. Each attention output reads layer inputs at earlier positions and its own position. Within the same attention layer no horizontal edge joins output positions.</desc>
