<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 283" role="img" aria-label="An illustrative power law for excess pretraining loss" style="min-width:0;max-width:560px;margin-inline:auto;font-variant-numeric:tabular-nums" font-family="system-ui, sans-serif">
  <title>An illustrative power law for excess pretraining loss</title>
  <desc>On logarithmic axes, E/E0 = (C/C0) to the power −1/4 is a straight line. Sixteen times the training compute halves excess loss in this drawing. The exponent and points are illustrative.</desc>
  <!-- Illustrative mathematical function. E(C) = L(C) − L∞. Background: Kaplan et al. (2020), https://arxiv.org/abs/2001.08361 . -->
  <text x="8" y="26" font-size="20" font-weight="620" text-anchor="start" fill="var(--heading, #102b56)">Relative excess loss   E / E₀</text>
  <path d="M 49 55 L 458 55" fill="none" stroke="var(--line, #dce2e9)" stroke-width="1.5" opacity="1"/>
  <text x="39" y="61" font-size="18" font-weight="480" text-anchor="end" fill="var(--muted, #526071)">1</text>
  <path d="M 49 135 L 458 135" fill="none" stroke="var(--line, #dce2e9)" stroke-width="1.5" opacity="1"/>
  <text x="39" y="141" font-size="18" font-weight="480" text-anchor="end" fill="var(--muted, #526071)">½</text>
  <path d="M 49 215 L 458 215" fill="none" stroke="var(--line, #dce2e9)" stroke-width="1.5" opacity="1"/>
  <text x="39" y="221" font-size="18" font-weight="480" text-anchor="end" fill="var(--muted, #526071)">¼</text>
  <path d="M 49 55 L 49 215" fill="none" stroke="var(--line, #dce2e9)" stroke-width="1" opacity="0.8" stroke-dasharray="3 4"/>
  <text x="49" y="240" font-size="18" font-weight="480" text-anchor="middle" fill="var(--muted, #526071)">1×</text>
  <path d="M 185.33 55 L 185.33 215" fill="none" stroke="var(--line, #dce2e9)" stroke-width="1" opacity="0.8" stroke-dasharray="3 4"/>
  <text x="185.33" y="240" font-size="18" font-weight="480" text-anchor="middle" fill="var(--muted, #526071)">4×</text>
  <path d="M 321.67 55 L 321.67 215" fill="none" stroke="var(--line, #dce2e9)" stroke-width="1" opacity="0.8" stroke-dasharray="3 4"/>
  <text x="321.67" y="240" font-size="18" font-weight="480" text-anchor="middle" fill="var(--muted, #526071)">16×</text>
  <path d="M 458 55 L 458 215" fill="none" stroke="var(--line, #dce2e9)" stroke-width="1" opacity="0.8" stroke-dasharray="3 4"/>
  <text x="458" y="240" font-size="18" font-weight="480" text-anchor="middle" fill="var(--muted, #526071)">64×</text>
  <path d="M 49 55 L 458 175" fill="none" stroke="var(--chart-teal, #2b7975)" stroke-width="3.5" opacity="1"/>
  <circle cx="49" cy="55" r="5" fill="var(--chart-teal, #2b7975)" stroke="var(--paper, #fff)" stroke-width="1.4"/>
  <circle cx="321.67" cy="135" r="5" fill="var(--chart-teal, #2b7975)" stroke="var(--paper, #fff)" stroke-width="1.4"/>
  <text x="164" y="69" font-size="18" font-weight="540" text-anchor="start" fill="var(--ink, #293441)">Assumed exponent  −¼</text>
  <text x="245" y="276" font-size="19" font-weight="620" text-anchor="middle" fill="var(--heading, #102b56)">Relative training compute   C / C₀</text>
</svg>
