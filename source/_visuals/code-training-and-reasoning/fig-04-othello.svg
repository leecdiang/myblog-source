<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="Legal moves after the opening C4 in Othello" style="min-width:0;max-width:560px;margin-inline:auto;font-variant-numeric:tabular-nums" font-family="system-ui, sans-serif">
  <title>Legal moves after the opening C4 in Othello</title>
  <desc>Rows run from top to bottom. Black played C4 and flipped D4. White can play C3, E3 or C5. Squares are derived from the rules, without using model outputs.</desc>
