  <text x="465" y="248" font-size="21" font-weight="620" text-anchor="end" fill="var(--ink, #293441)">2</text>
  <text x="19" y="291" font-size="21" font-weight="570" text-anchor="start" fill="var(--ink, #293441)">2</text>
  <text x="123" y="291" font-size="20" font-weight="450" text-anchor="start" fill="var(--ink, #293441)">Fill</text>
  <rect x="263" y="275" width="18" height="18" rx="2" fill="var(--surface, #f3f5f8)" fill-opacity="1" stroke="var(--line, #dce2e9)" stroke-width="1"/>
