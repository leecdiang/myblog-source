<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 357" role="img" aria-label="Code replacement and code addition at a 50 percent mixture" style="min-width:0;max-width:560px;margin-inline:auto;font-variant-numeric:tabular-nums" font-family="system-ui, sans-serif">
  <title>Code replacement and code addition at a 50 percent mixture</title>
  <desc>Petty and colleagues compared a 132-billion-token language-only baseline with 66B language plus 66B code, and 132B language plus 132B code. A language-only run with 264B total tokens matches the additive run.</desc>
  <!-- Original rendering of Petty, van Steenkiste & Linzen (TMLR 2025), Fig. 1 and sections 3–4.1. https://openreview.net/forum?id=pxxmUKKgel . Segments encode counts; training sequences were interleaved. -->
  <text x="8" y="29" font-size="21" font-weight="650" text-anchor="start" fill="var(--heading, #102b56)">Pretraining tokens (billions)</text>
  <rect x="9" y="43" width="18" height="14" rx="2" fill="var(--chart-blue, #376b9f)" fill-opacity="1" stroke="none" stroke-width="1.4"/>
  <text x="36" y="56" font-size="18" font-weight="450" text-anchor="start" fill="var(--ink, #293441)">Text</text>
  <rect x="108" y="43" width="18" height="14" rx="2" fill="var(--chart-teal, #2b7975)" fill-opacity="1" stroke="none" stroke-width="1.4"/>
  <text x="135" y="56" font-size="18" font-weight="450" text-anchor="start" fill="var(--ink, #293441)">Code</text>
  <text x="8" y="89" font-size="19" font-weight="560" text-anchor="start" fill="var(--ink, #293441)">Text baseline</text>
  <text x="469" y="89" font-size="18" font-weight="460" text-anchor="end" fill="var(--muted, #526071)">132B total</text>
  <rect x="8" y="97" width="464" height="29" rx="2" fill="var(--surface, #f3f5f8)" fill-opacity="1" stroke="none" stroke-width="1.4"/>
  <rect x="8" y="97" width="232" height="29" rx="0" fill="var(--chart-blue, #376b9f)" fill-opacity="0.16" stroke="var(--chart-blue, #376b9f)" stroke-width="1"/>
  <text x="124" y="118" font-size="18" font-weight="590" text-anchor="middle" fill="var(--ink, #293441)">132B text</text>
  <text x="8" y="158" font-size="19" font-weight="560" text-anchor="start" fill="var(--ink, #293441)">Fixed total</text>
  <text x="469" y="158" font-size="18" font-weight="460" text-anchor="end" fill="var(--muted, #526071)">132B total</text>
  <rect x="8" y="166" width="464" height="29" rx="2" fill="var(--surface, #f3f5f8)" fill-opacity="1" stroke="none" stroke-width="1.4"/>
  <rect x="8" y="166" width="116" height="29" rx="0" fill="var(--chart-blue, #376b9f)" fill-opacity="0.16" stroke="var(--chart-blue, #376b9f)" stroke-width="1"/>
  <text x="66" y="187" font-size="18" font-weight="590" text-anchor="middle" fill="var(--ink, #293441)">66B text</text>
  <rect x="124" y="166" width="116" height="29" rx="0" fill="var(--chart-teal, #2b7975)" fill-opacity="0.16" stroke="var(--chart-teal, #2b7975)" stroke-width="1"/>
  <text x="182" y="187" font-size="18" font-weight="590" text-anchor="middle" fill="var(--ink, #293441)">66B code</text>
  <text x="8" y="227" font-size="19" font-weight="560" text-anchor="start" fill="var(--ink, #293441)">Fixed text</text>
  <text x="469" y="227" font-size="18" font-weight="460" text-anchor="end" fill="var(--muted, #526071)">264B total</text>
  <rect x="8" y="235" width="464" height="29" rx="2" fill="var(--surface, #f3f5f8)" fill-opacity="1" stroke="none" stroke-width="1.4"/>
  <rect x="8" y="235" width="232" height="29" rx="0" fill="var(--chart-blue, #376b9f)" fill-opacity="0.16" stroke="var(--chart-blue, #376b9f)" stroke-width="1"/>
  <text x="124" y="256" font-size="18" font-weight="590" text-anchor="middle" fill="var(--ink, #293441)">132B text</text>
  <rect x="240" y="235" width="232" height="29" rx="0" fill="var(--chart-teal, #2b7975)" fill-opacity="0.16" stroke="var(--chart-teal, #2b7975)" stroke-width="1"/>
  <text x="356" y="256" font-size="18" font-weight="590" text-anchor="middle" fill="var(--ink, #293441)">132B code</text>
  <text x="8" y="296" font-size="19" font-weight="560" text-anchor="start" fill="var(--ink, #293441)">Long text control</text>
  <text x="469" y="296" font-size="18" font-weight="460" text-anchor="end" fill="var(--muted, #526071)">264B total</text>
  <rect x="8" y="304" width="464" height="29" rx="2" fill="var(--surface, #f3f5f8)" fill-opacity="1" stroke="none" stroke-width="1.4"/>
  <rect x="8" y="304" width="464" height="29" rx="0" fill="var(--chart-blue, #376b9f)" fill-opacity="0.16" stroke="var(--chart-blue, #376b9f)" stroke-width="1"/>
  <text x="240" y="325" font-size="18" font-weight="590" text-anchor="middle" fill="var(--ink, #293441)">264B text</text>
  <text x="8" y="354" font-size="18" font-weight="450" text-anchor="start" fill="var(--muted, #526071)">All bars use the same scale.</text>
</svg>
