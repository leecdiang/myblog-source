<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-label="ECN → CNP → 源端调速。拥塞标记、反馈消息、控制算法，是三个不同环节。" font-family="system-ui, -apple-system, Segoe UI, Noto Sans CJK SC, sans-serif"><title>ECN → CNP → 源端调速</title><desc>拥塞标记、反馈消息、控制算法，是三个不同环节。</desc><defs><marker id="fc-fig06_dcqcn-b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-blue)"/></marker><marker id="fc-fig06_dcqcn-t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-teal)"/></marker><marker id="fc-fig06_dcqcn-a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-amber)"/></marker><marker id="fc-fig06_dcqcn-r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-red)"/></marker><marker id="fc-fig06_dcqcn-s" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--text-secondary)"/></marker></defs><text x="30" y="40" font-size="26" fill="var(--text-primary)" text-anchor="start" font-weight="650">ECN → CNP → 源端调速</text><text x="30" y="73" font-size="17" fill="var(--text-secondary)" text-anchor="start" font-weight="400">拥塞标记、反馈消息、控制算法，是三个不同环节。</text><text x="140" y="122" font-size="22" fill="var(--chart-blue)" text-anchor="middle" font-weight="600">发送端 RP</text><text x="140" y="149" font-size="17" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">Reaction Point</text><path d="M140 167L140 495" fill="none" stroke="var(--divider)" stroke-width="2" stroke-dasharray="6 6"/><text x="450" y="122" font-size="22" fill="var(--chart-amber)" text-anchor="middle" font-weight="600">交换机 CP</text><text x="450" y="149" font-size="17" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">Congestion Point</text><path d="M450 167L450 495" fill="none" stroke="var(--divider)" stroke-width="2" stroke-dasharray="6 6"/><text x="760" y="122" font-size="22" fill="var(--chart-teal)" text-anchor="middle" font-weight="600">接收端 NP</text><text x="760" y="149" font-size="17" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">Notification Point</text><path d="M760 167L760 495" fill="none" stroke="var(--divider)" stroke-width="2" stroke-dasharray="6 6"/><path d="M148 207L442 238" fill="none" stroke="var(--chart-blue)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig06_dcqcn-b)"/><text x="290" y="199" font-size="18" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">① 发送 RoCEv2 数据</text><rect x="362" y="248" width="176" height="54" rx="12" fill="var(--surface-soft)" stroke="var(--chart-amber)" stroke-width="1.5"/><text x="450" y="281" font-size="18" fill="var(--chart-amber)" text-anchor="middle" font-weight="400">② 拥塞时标 CE</text><path d="M458 315L752 345" fill="none" stroke="var(--chart-teal)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig06_dcqcn-t)"/><text x="620" y="306" font-size="18" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">③ 带标记的数据继续前进</text><path d="M752 385L148 430" fill="none" stroke="var(--chart-red)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig06_dcqcn-r)"/><text x="445" y="384" font-size="19" fill="var(--chart-red)" text-anchor="middle" font-weight="400">④ 接收端返回 CNP（可限制反馈频率）</text><rect x="42" y="449" width="196" height="57" rx="12" fill="var(--surface-soft)" stroke="var(--chart-blue)" stroke-width="1.5"/><text x="140" y="484" font-size="19" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">⑤ 更新发送速率</text><text x="450" y="547" font-size="17" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">PFC 不在这条端到端反馈链里；它可以作为独立的逐跳保护机制同时运行。</text></svg>