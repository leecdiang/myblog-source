<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-label="暂停请求发出后，仍需接住在途数据。停止生效不是瞬时事件；headroom 保护的正是这段空窗。" font-family="system-ui, -apple-system, Segoe UI, Noto Sans CJK SC, sans-serif"><title>暂停请求发出后，仍需接住在途数据</title><desc>停止生效不是瞬时事件；headroom 保护的正是这段空窗。</desc><defs><marker id="fc-fig03_stop_delay-b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-blue)"/></marker><marker id="fc-fig03_stop_delay-t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-teal)"/></marker><marker id="fc-fig03_stop_delay-a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-amber)"/></marker><marker id="fc-fig03_stop_delay-r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-red)"/></marker><marker id="fc-fig03_stop_delay-s" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--text-secondary)"/></marker></defs><text x="30" y="40" font-size="26" fill="var(--text-primary)" text-anchor="start" font-weight="650">暂停请求发出后，仍需接住在途数据</text><text x="30" y="73" font-size="17" fill="var(--text-secondary)" text-anchor="start" font-weight="400">停止生效不是瞬时事件；headroom 保护的正是这段空窗。</text><text x="185" y="120" font-size="21" fill="var(--chart-blue)" text-anchor="middle" font-weight="600">发送端 A</text><text x="610" y="120" font-size="21" fill="var(--chart-teal)" text-anchor="middle" font-weight="600">接收端 B</text><path d="M185 140L185 390" fill="none" stroke="var(--text-secondary)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig03_stop_delay-s)"/><path d="M610 140L610 390" fill="none" stroke="var(--text-secondary)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig03_stop_delay-s)"/><text x="65" y="175" font-size="18" fill="var(--text-secondary)" text-anchor="start" font-weight="400">时间</text><circle cx="610" cy="166" r="5" fill="var(--chart-red)"/><text x="633" y="172" font-size="19" fill="var(--chart-red)" text-anchor="start" font-weight="400">XOFF 触发</text><path d="M602 172L193 240" fill="none" stroke="var(--chart-amber)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig03_stop_delay-a)"/><text x="386" y="180" font-size="19" fill="var(--chart-amber)" text-anchor="middle" font-weight="400">暂停请求向上游传递</text><text x="45" y="250" font-size="18" fill="var(--text-secondary)" text-anchor="start" font-weight="400">接收请求</text><text x="45" y="276" font-size="18" fill="var(--text-secondary)" text-anchor="start" font-weight="400">响应暂停</text><path d="M193 155L602 280" fill="none" stroke="var(--chart-blue)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig03_stop_delay-b)"/><path d="M193 190L602 315" fill="none" stroke="var(--chart-blue)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig03_stop_delay-b)"/><path d="M193 225L602 350" fill="none" stroke="var(--chart-blue)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig03_stop_delay-b)"/><text x="375" y="365" font-size="18" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">先前发出的数据仍在抵达</text><circle cx="610" cy="352" r="5" fill="var(--chart-red)"/><text x="633" y="359" font-size="19" fill="var(--chart-red)" text-anchor="start" font-weight="400">最后一批抵达</text><path d="M790 166L790 352" fill="none" stroke="var(--chart-red)" stroke-width="2"/><path d="M780 166L800 166" fill="none" stroke="var(--chart-red)" stroke-width="2"/><path d="M780 352L800 352" fill="none" stroke="var(--chart-red)" stroke-width="2"/><text x="806" y="264" font-size="19" fill="var(--chart-red)" text-anchor="start" font-weight="400">Tstop</text><text x="30" y="439" font-size="20" fill="var(--text-primary)" text-anchor="start" font-weight="600">缓冲占用</text><rect x="160" y="418" width="630" height="54" rx="5" fill="var(--surface-soft)" stroke="var(--divider)" stroke-width="1.5"/><rect x="160" y="418" width="400" height="54" rx="4" fill="var(--chart-blue)" stroke="var(--chart-blue)" stroke-width="1.5" fill-opacity="0.14"/><rect x="560" y="418" width="230" height="54" rx="4" fill="var(--chart-amber)" stroke="var(--chart-amber)" stroke-width="1.5" fill-opacity="0.15"/><text x="360" y="452" font-size="19" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">已占用 / 常规缓冲</text><text x="675" y="452" font-size="20" fill="var(--chart-amber)" text-anchor="middle" font-weight="400">headroom</text><path d="M430 409L430 481" fill="none" stroke="var(--chart-teal)" stroke-width="2"/><path d="M560 409L560 481" fill="none" stroke="var(--chart-red)" stroke-width="2"/><text x="430" y="510" font-size="18" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">XON</text><text x="560" y="510" font-size="18" fill="var(--chart-red)" text-anchor="middle" font-weight="400">XOFF</text><text x="790" y="510" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">容量边界</text><text x="450" y="550" font-size="17" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">阈值与分区仅为逻辑示意；不代表某款交换机的物理内存布局。</text></svg>