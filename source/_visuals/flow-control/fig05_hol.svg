<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-label="同一优先级的业务，可能一起被按下暂停。A 的目的方向拥塞；B 的目的方向空闲，但共享上游暂停边界。" font-family="system-ui, -apple-system, Segoe UI, Noto Sans CJK SC, sans-serif"><title>同一优先级的业务，可能一起被按下暂停</title><desc>A 的目的方向拥塞；B 的目的方向空闲，但共享上游暂停边界。</desc><defs><marker id="fc-fig05_hol-b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-blue)"/></marker><marker id="fc-fig05_hol-t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-teal)"/></marker><marker id="fc-fig05_hol-a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-amber)"/></marker><marker id="fc-fig05_hol-r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-red)"/></marker><marker id="fc-fig05_hol-s" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--text-secondary)"/></marker></defs><text x="30" y="40" font-size="26" fill="var(--text-primary)" text-anchor="start" font-weight="650">同一优先级的业务，可能一起被按下暂停</text><text x="30" y="73" font-size="17" fill="var(--text-secondary)" text-anchor="start" font-weight="400">A 的目的方向拥塞；B 的目的方向空闲，但共享上游暂停边界。</text><rect x="30" y="143" width="170" height="155" rx="12" fill="var(--surface-soft)" stroke="var(--chart-blue)" stroke-width="1.5"/><text x="115" y="177" font-size="21" fill="var(--chart-blue)" text-anchor="middle" font-weight="600">上游发送者</text><text x="115" y="208" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">流 A → 目的 A</text><text x="115" y="234" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">流 B → 目的 B</text><text x="115" y="260" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">两者均用 P3</text><rect x="345" y="163" width="190" height="115" rx="12" fill="var(--surface-soft)" stroke="var(--chart-blue)" stroke-width="1.5"/><text x="440" y="197" font-size="21" fill="var(--chart-blue)" text-anchor="middle" font-weight="600">交换机</text><text x="440" y="228" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">按目的地转发</text><rect x="680" y="115" width="185" height="90" rx="12" fill="var(--surface-soft)" stroke="var(--chart-red)" stroke-width="1.5"/><text x="772.5" y="149" font-size="21" fill="var(--chart-red)" text-anchor="middle" font-weight="600">目的 A</text><text x="772.5" y="180" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">输出拥塞</text><rect x="680" y="270" width="185" height="90" rx="12" fill="var(--surface-soft)" stroke="var(--chart-teal)" stroke-width="1.5"/><text x="772.5" y="304" font-size="21" fill="var(--chart-teal)" text-anchor="middle" font-weight="600">目的 B</text><text x="772.5" y="335" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">输出空闲</text><path d="M205 201L338 201" fill="none" stroke="var(--chart-blue)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig05_hol-b)"/><text x="270" y="187" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">共享 P3</text><path d="M338 252L205 252" fill="none" stroke="var(--chart-amber)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig05_hol-a)"/><text x="270" y="283" font-size="18" fill="var(--chart-amber)" text-anchor="middle" font-weight="400">PFC：停 P3</text><path d="M535 192H605V160H673" fill="none" stroke="var(--chart-red)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig05_hol-r)"/><path d="M535 249H605V315H673" fill="none" stroke="var(--chart-teal)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig05_hol-t)"/><text x="575" y="145" font-size="18" fill="var(--chart-red)" text-anchor="start" font-weight="400">流 A</text><text x="575" y="348" font-size="18" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">流 B 也被上游暂停</text><path d="M30 398L870 398" fill="none" stroke="var(--divider)" stroke-width="2"/><text x="30" y="434" font-size="21" fill="var(--text-primary)" text-anchor="start" font-weight="600">拥塞可能继续向上游传播</text><rect x="65" y="460" width="170" height="62" rx="12" fill="var(--surface-soft)" stroke="var(--chart-amber)" stroke-width="1.5"/><text x="150" y="498" font-size="20" fill="var(--chart-amber)" text-anchor="middle" font-weight="400">更上游</text><rect x="355" y="460" width="170" height="62" rx="12" fill="var(--surface-soft)" stroke="var(--chart-amber)" stroke-width="1.5"/><text x="440" y="498" font-size="20" fill="var(--chart-amber)" text-anchor="middle" font-weight="400">上游队列</text><rect x="645" y="460" width="170" height="62" rx="12" fill="var(--surface-soft)" stroke="var(--chart-amber)" stroke-width="1.5"/><text x="730" y="498" font-size="20" fill="var(--chart-amber)" text-anchor="middle" font-weight="400">拥塞处</text><path d="M640 490L530 490" fill="none" stroke="var(--chart-amber)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig05_hol-a)"/><path d="M350 490L240 490" fill="none" stroke="var(--chart-amber)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig05_hol-a)"/><text x="450" y="552" font-size="17" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">队列各自积压，各自生成新的暂停请求；并非原帧被逐跳转发。</text></svg>