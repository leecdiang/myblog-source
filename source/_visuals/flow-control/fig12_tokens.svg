<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" role="img" aria-label="同样是额度，增加的原因不同。看计数器的更新规则，比看寄存器名字更有用。" font-family="system-ui, -apple-system, Segoe UI, Noto Sans CJK SC, sans-serif"><title>同样是额度，增加的原因不同</title><desc>看计数器的更新规则，比看寄存器名字更有用。</desc><defs><marker id="fc-fig12_tokens-b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-blue)"/></marker><marker id="fc-fig12_tokens-t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-teal)"/></marker><marker id="fc-fig12_tokens-a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-amber)"/></marker><marker id="fc-fig12_tokens-r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-red)"/></marker><marker id="fc-fig12_tokens-s" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--text-secondary)"/></marker></defs><text x="30" y="40" font-size="26" fill="var(--text-primary)" text-anchor="start" font-weight="650">同样是额度，增加的原因不同</text><text x="30" y="73" font-size="17" fill="var(--text-secondary)" text-anchor="start" font-weight="400">看计数器的更新规则，比看寄存器名字更有用。</text><rect x="30" y="122" width="390" height="150" rx="12" fill="var(--surface-soft)" stroke="var(--chart-blue)" stroke-width="1.5"/><text x="225" y="156" font-size="21" fill="var(--chart-blue)" text-anchor="middle" font-weight="600">Token Bucket</text><text x="225" y="187" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">随时间按速率 r 补充</text><text x="225" y="213" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">发送消耗预算；桶容量 B 允许突发</text><text x="225" y="239" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">不需要接收方先释放空间</text><rect x="480" y="122" width="390" height="150" rx="12" fill="var(--surface-soft)" stroke="var(--chart-teal)" stroke-width="1.5"/><text x="675" y="156" font-size="21" fill="var(--chart-teal)" text-anchor="middle" font-weight="600">接收 Buffer Credit</text><text x="675" y="187" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">接收方拥有并承诺空间</text><text x="675" y="213" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">发送消耗许可；释放后更新额度</text><text x="675" y="239" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">不能只靠本地定时器创造空间</text><text x="450" y="324" font-size="22" fill="var(--text-primary)" text-anchor="middle" font-weight="600">发送还要同时满足多种条件</text><rect x="30" y="356" width="185" height="105" rx="12" fill="var(--surface-soft)" stroke="var(--chart-blue)" stroke-width="1.5"/><text x="122.5" y="390" font-size="21" fill="var(--chart-blue)" text-anchor="middle" font-weight="600">队列调度</text><text x="122.5" y="421" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">当前选谁？</text><rect x="285" y="356" width="250" height="105" rx="12" fill="var(--surface-soft)" stroke="var(--chart-blue)" stroke-width="1.5"/><text x="410" y="390" font-size="21" fill="var(--chart-blue)" text-anchor="middle" font-weight="600">速率 / 额度资格</text><text x="410" y="421" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">现在允许发多少？</text><rect x="605" y="356" width="265" height="105" rx="12" fill="var(--surface-soft)" stroke="var(--chart-blue)" stroke-width="1.5"/><text x="737.5" y="390" font-size="21" fill="var(--chart-blue)" text-anchor="middle" font-weight="600">链路发送条件</text><text x="737.5" y="421" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">是否被 PFC 暂停？</text><path d="M222 408L277 408" fill="none" stroke="var(--chart-blue)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig12_tokens-b)"/><path d="M542 408L598 408" fill="none" stroke="var(--chart-blue)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig12_tokens-b)"/><text x="450" y="511" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">这些是逻辑条件；具体实现可以合并、重排或使用联合仲裁。</text></svg>