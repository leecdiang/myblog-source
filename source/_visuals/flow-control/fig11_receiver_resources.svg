<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="接收端资源不足，也有不同的含义。TCP 的字节窗口，与 RC RDMA 的接收 WQE，不是同一个资源。" font-family="system-ui, -apple-system, Segoe UI, Noto Sans CJK SC, sans-serif"><title>接收端资源不足，也有不同的含义</title><desc>TCP 的字节窗口，与 RC RDMA 的接收 WQE，不是同一个资源。</desc><defs><marker id="fc-fig11_receiver_resources-b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-blue)"/></marker><marker id="fc-fig11_receiver_resources-t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-teal)"/></marker><marker id="fc-fig11_receiver_resources-a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-amber)"/></marker><marker id="fc-fig11_receiver_resources-r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-red)"/></marker><marker id="fc-fig11_receiver_resources-s" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--text-secondary)"/></marker></defs><text x="30" y="40" font-size="26" fill="var(--text-primary)" text-anchor="start" font-weight="650">接收端资源不足，也有不同的含义</text><text x="30" y="73" font-size="17" fill="var(--text-secondary)" text-anchor="start" font-weight="400">TCP 的字节窗口，与 RC RDMA 的接收 WQE，不是同一个资源。</text><rect x="30" y="116" width="400" height="378" rx="12" fill="var(--surface-soft)" stroke="var(--chart-blue)" stroke-width="1.5"/><rect x="470" y="116" width="400" height="378" rx="12" fill="var(--surface-soft)" stroke="var(--chart-teal)" stroke-width="1.5"/><text x="230" y="152" font-size="22" fill="var(--chart-blue)" text-anchor="middle" font-weight="600">TCP：两道窗口约束</text><text x="55" y="197" font-size="20" fill="var(--text-primary)" text-anchor="start" font-weight="400">rwnd</text><rect x="75" y="212" width="300" height="25" rx="3" fill="var(--surface-soft)" stroke="var(--divider)" stroke-width="1.5"/><rect x="75" y="212" width="75" height="25" rx="3" fill="var(--chart-blue)" stroke="var(--chart-blue)" stroke-width="1.5" fill-opacity="0.25"/><text x="390" y="232" font-size="17" fill="var(--chart-blue)" text-anchor="end" font-weight="400">64</text><text x="55" y="272" font-size="20" fill="var(--text-primary)" text-anchor="start" font-weight="400">cwnd</text><rect x="75" y="287" width="300" height="25" rx="3" fill="var(--surface-soft)" stroke="var(--divider)" stroke-width="1.5"/><rect x="75" y="287" width="300" height="25" rx="3" fill="var(--chart-teal)" stroke="var(--chart-teal)" stroke-width="1.5" fill-opacity="0.25"/><text x="390" y="307" font-size="17" fill="var(--chart-teal)" text-anchor="end" font-weight="400">256</text><text x="230" y="365" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">单位：KiB</text><text x="230" y="397" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">有效窗口 = min(64, 256) = 64</text><text x="230" y="429" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">已在途 48，新增余量 16</text><text x="670" y="152" font-size="22" fill="var(--chart-teal)" text-anchor="middle" font-weight="600">RC RDMA：接收 WQE</text><rect x="510" y="180" width="320" height="82" rx="12" fill="var(--surface-soft)" stroke="var(--chart-teal)" stroke-width="1.5"/><text x="670" y="214" font-size="21" fill="var(--chart-teal)" text-anchor="middle" font-weight="600">SEND / WRITE with Immediate</text><path d="M670 270L670 305" fill="none" stroke="var(--chart-teal)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig11_receiver_resources-t)"/><rect x="535" y="311" width="270" height="62" rx="12" fill="var(--surface-soft)" stroke="var(--chart-amber)" stroke-width="1.5"/><text x="670" y="349" font-size="18" fill="var(--chart-amber)" text-anchor="middle" font-weight="400">没有可用 Receive WQE</text><path d="M670 381L670 410" fill="none" stroke="var(--chart-amber)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig11_receiver_resources-a)"/><text x="670" y="444" font-size="20" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">RNR NAK → 等待 / 重试</text><text x="670" y="477" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">并不代表交换网络拥塞</text></svg>