<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="拥塞控制可以观察不同信号。比较观测路径与实现条件，不给算法排性能名次。" font-family="system-ui, -apple-system, Segoe UI, Noto Sans CJK SC, sans-serif"><title>拥塞控制可以观察不同信号</title><desc>比较观测路径与实现条件，不给算法排性能名次。</desc><defs><marker id="fc-fig07_signals-b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-blue)"/></marker><marker id="fc-fig07_signals-t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-teal)"/></marker><marker id="fc-fig07_signals-a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-amber)"/></marker><marker id="fc-fig07_signals-r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-red)"/></marker><marker id="fc-fig07_signals-s" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--text-secondary)"/></marker></defs><text x="30" y="40" font-size="26" fill="var(--text-primary)" text-anchor="start" font-weight="650">拥塞控制可以观察不同信号</text><text x="30" y="73" font-size="17" fill="var(--text-secondary)" text-anchor="start" font-weight="400">比较观测路径与实现条件，不给算法排性能名次。</text><text x="38" y="128" font-size="19" fill="var(--text-secondary)" text-anchor="start" font-weight="600">机制</text><text x="178" y="128" font-size="19" fill="var(--text-secondary)" text-anchor="start" font-weight="600">主要信号</text><text x="468" y="128" font-size="19" fill="var(--text-secondary)" text-anchor="start" font-weight="600">反馈到源端</text><text x="683" y="128" font-size="19" fill="var(--text-secondary)" text-anchor="start" font-weight="600">需要处理的条件</text><rect x="30" y="151" width="840" height="67" rx="9" fill="var(--surface-soft)" stroke="var(--divider)" stroke-width="1.5"/><text x="44" y="192" font-size="20" fill="var(--chart-blue)" text-anchor="start" font-weight="650">DCQCN</text><text x="178" y="192" font-size="19" fill="var(--text-primary)" text-anchor="start" font-weight="400">ECN / CE 标记</text><text x="468" y="192" font-size="19" fill="var(--text-primary)" text-anchor="start" font-weight="400">接收端 CNP</text><text x="683" y="192" font-size="18" fill="var(--text-secondary)" text-anchor="start" font-weight="400">标记与反馈时延</text><rect x="30" y="232" width="840" height="67" rx="9" fill="var(--surface-soft)" stroke="var(--divider)" stroke-width="1.5"/><text x="44" y="273" font-size="20" fill="var(--chart-amber)" text-anchor="start" font-weight="650">QCN</text><text x="178" y="273" font-size="19" fill="var(--text-primary)" text-anchor="start" font-weight="400">二层拥塞通知</text><text x="468" y="273" font-size="19" fill="var(--text-primary)" text-anchor="start" font-weight="400">拥塞点通知源端</text><text x="683" y="273" font-size="18" fill="var(--text-secondary)" text-anchor="start" font-weight="400">域内端点支持</text><rect x="30" y="313" width="840" height="67" rx="9" fill="var(--surface-soft)" stroke="var(--divider)" stroke-width="1.5"/><text x="44" y="354" font-size="20" fill="var(--chart-teal)" text-anchor="start" font-weight="650">TIMELY</text><text x="178" y="354" font-size="19" fill="var(--text-primary)" text-anchor="start" font-weight="400">RTT 及其变化</text><text x="468" y="354" font-size="19" fill="var(--text-primary)" text-anchor="start" font-weight="400">时延测量反馈</text><text x="683" y="354" font-size="18" fill="var(--text-secondary)" text-anchor="start" font-weight="400">测时精度与噪声</text><rect x="30" y="394" width="840" height="67" rx="9" fill="var(--surface-soft)" stroke="var(--divider)" stroke-width="1.5"/><text x="44" y="435" font-size="20" fill="var(--chart-red)" text-anchor="start" font-weight="650">HPCC</text><text x="178" y="435" font-size="19" fill="var(--text-primary)" text-anchor="start" font-weight="400">带内遥测 INT</text><text x="468" y="435" font-size="19" fill="var(--text-primary)" text-anchor="start" font-weight="400">更细的负载信息</text><text x="683" y="435" font-size="18" fill="var(--text-secondary)" text-anchor="start" font-weight="400">设备与报文支持</text><text x="30" y="504" font-size="18" fill="var(--text-secondary)" text-anchor="start" font-weight="400">更丰富的信息不等于零延迟；采集、传输和执行控制仍然需要时间。</text></svg>