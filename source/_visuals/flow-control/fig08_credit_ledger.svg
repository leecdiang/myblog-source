<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Credit：先承诺空间，再允许数据前进。教学模型：8 个等大槽位，5 个占用；初始无在途数据，账本已同步。" font-family="system-ui, -apple-system, Segoe UI, Noto Sans CJK SC, sans-serif"><title>Credit：先承诺空间，再允许数据前进</title><desc>教学模型：8 个等大槽位，5 个占用；初始无在途数据，账本已同步。</desc><defs><marker id="fc-fig08_credit_ledger-b" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-blue)"/></marker><marker id="fc-fig08_credit_ledger-t" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-teal)"/></marker><marker id="fc-fig08_credit_ledger-a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-amber)"/></marker><marker id="fc-fig08_credit_ledger-r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--chart-red)"/></marker><marker id="fc-fig08_credit_ledger-s" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="var(--text-secondary)"/></marker></defs><text x="30" y="40" font-size="26" fill="var(--text-primary)" text-anchor="start" font-weight="650">Credit：先承诺空间，再允许数据前进</text><text x="30" y="73" font-size="17" fill="var(--text-secondary)" text-anchor="start" font-weight="400">教学模型：8 个等大槽位，5 个占用；初始无在途数据，账本已同步。</text><rect x="30" y="140" width="230" height="130" rx="12" fill="var(--surface-soft)" stroke="var(--chart-blue)" stroke-width="1.5"/><text x="145" y="174" font-size="21" fill="var(--chart-blue)" text-anchor="middle" font-weight="600">发送端账本</text><text x="145" y="205" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">可用 credit = 3</text><text x="145" y="231" font-size="18" fill="var(--text-secondary)" text-anchor="middle" font-weight="400">发送一个，扣减一个</text><text x="570" y="125" font-size="22" fill="var(--text-primary)" text-anchor="middle" font-weight="600">接收端：8 个槽位</text><rect x="350" y="148" width="52" height="78" rx="12" fill="var(--chart-blue)" stroke="var(--chart-blue)" stroke-width="1.5" fill-opacity="0.11"/><text x="376" y="181" font-size="19" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">1</text><text x="376" y="210" font-size="18" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">占</text><rect x="413" y="148" width="52" height="78" rx="12" fill="var(--chart-blue)" stroke="var(--chart-blue)" stroke-width="1.5" fill-opacity="0.11"/><text x="439" y="181" font-size="19" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">2</text><text x="439" y="210" font-size="18" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">占</text><rect x="476" y="148" width="52" height="78" rx="12" fill="var(--chart-blue)" stroke="var(--chart-blue)" stroke-width="1.5" fill-opacity="0.11"/><text x="502" y="181" font-size="19" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">3</text><text x="502" y="210" font-size="18" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">占</text><rect x="539" y="148" width="52" height="78" rx="12" fill="var(--chart-blue)" stroke="var(--chart-blue)" stroke-width="1.5" fill-opacity="0.11"/><text x="565" y="181" font-size="19" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">4</text><text x="565" y="210" font-size="18" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">占</text><rect x="602" y="148" width="52" height="78" rx="12" fill="var(--chart-blue)" stroke="var(--chart-blue)" stroke-width="1.5" fill-opacity="0.11"/><text x="628" y="181" font-size="19" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">5</text><text x="628" y="210" font-size="18" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">占</text><rect x="665" y="148" width="52" height="78" rx="12" fill="var(--chart-teal)" stroke="var(--chart-teal)" stroke-width="1.5" fill-opacity="0.11"/><text x="691" y="181" font-size="19" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">6</text><text x="691" y="210" font-size="18" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">空</text><rect x="728" y="148" width="52" height="78" rx="12" fill="var(--chart-teal)" stroke="var(--chart-teal)" stroke-width="1.5" fill-opacity="0.11"/><text x="754" y="181" font-size="19" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">7</text><text x="754" y="210" font-size="18" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">空</text><rect x="791" y="148" width="52" height="78" rx="12" fill="var(--chart-teal)" stroke="var(--chart-teal)" stroke-width="1.5" fill-opacity="0.11"/><text x="817" y="181" font-size="19" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">8</text><text x="817" y="210" font-size="18" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">空</text><path d="M268 254L842 254" fill="none" stroke="var(--chart-blue)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig08_credit_ledger-b)"/><text x="555" y="286" font-size="19" fill="var(--chart-blue)" text-anchor="middle" font-weight="400">数据向右：消耗已经获得的许可</text><path d="M840 337L268 337" fill="none" stroke="var(--chart-teal)" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#fc-fig08_credit_ledger-t)"/><text x="555" y="371" font-size="19" fill="var(--chart-teal)" text-anchor="middle" font-weight="400">额度向左：释放资源并反馈可用额度</text><rect x="30" y="414" width="840" height="67" rx="12" fill="var(--surface-soft)" stroke="var(--chart-amber)" stroke-width="1.5"/><text x="450" y="442" font-size="18" fill="var(--chart-amber)" text-anchor="middle" font-weight="400">已发出但未到达的数据，也必须占用已承诺的空间。</text><text x="450" y="468" font-size="18" fill="var(--chart-amber)" text-anchor="middle" font-weight="400">反馈尚未到达时，“实际空闲”不等于“发送端可用 credit”。</text></svg>