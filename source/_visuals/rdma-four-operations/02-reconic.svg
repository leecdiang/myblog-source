  <polygon points="651.0,354.0 646.05,363.57 655.95,363.57" fill="var(--chart-teal, #226b63)" />
  <text x="484" y="391" fill="var(--text-secondary, #435669)" text-anchor="middle" font-size="14.5" font-weight="580" class="v-sub">PCIe</text>
