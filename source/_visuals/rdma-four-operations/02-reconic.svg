  <text x="449.0" y="451.5" fill="var(--text-primary, #233442)" text-anchor="middle" font-size="18" font-weight="620" class="v-ink">Host DRAM</text>
  <rect x="562" y="417" width="176" height="57" rx="7" fill="var(--surface-card, #ffffff)" stroke="var(--figure-line, #abb8c4)" stroke-width="1.6" />
  <text x="650.0" y="451.5" fill="var(--text-primary, #233442)" text-anchor="middle" font-size="18" font-weight="620" class="v-ink">On-card DDR</text>
</svg>
