  <text x="92.5" y="341.5" fill="var(--text-secondary, #435669)" text-anchor="middle" font-size="14" font-weight="450" class="v-sub">RDMA engine</text>
  <rect x="181" y="286" width="146" height="75" rx="7" fill="var(--surface-card, #ffffff)" stroke="var(--figure-line, #abb8c4)" stroke-width="1.6" />
  <text x="254.0" y="321.5" fill="var(--text-primary, #233442)" text-anchor="middle" font-size="18" font-weight="620" class="v-ink">QDMA RX</text>
  <text x="254.0" y="341.5" fill="var(--text-secondary, #435669)" text-anchor="middle" font-size="14" font-weight="450" class="v-sub">Packet stream</text>
  <path d="M 250 362 V 396" fill="none" stroke="var(--text-secondary, #435669)" stroke-width="2.05" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#rd4-rn-sub)" />
  <rect x="181" y="400" width="146" height="51" rx="7" fill="var(--surface-card, #ffffff)" stroke="var(--figure-line, #abb8c4)" stroke-width="1.6" />
  <text x="254.0" y="431.5" fill="var(--text-primary, #233442)" text-anchor="middle" font-size="15.5" font-weight="620" class="v-ink">Host RX buffers</text>
  <text x="92" y="391" fill="var(--text-secondary, #435669)" text-anchor="middle" font-size="14" font-weight="450" class="v-sub">AMD licensed IP</text>
  <rect x="422" y="64" width="255" height="55" rx="7" fill="var(--surface-card, #ffffff)" stroke="var(--chart-blue, #3c689a)" stroke-width="1.6" />
  <text x="549.5" y="89.5" fill="var(--text-primary, #233442)" text-anchor="middle" font-size="18" font-weight="620" class="v-ink">ERNIC 3.1</text>
  <text x="549.5" y="109.5" fill="var(--text-secondary, #435669)" text-anchor="middle" font-size="14" font-weight="450" class="v-sub">AXI memory-mapped ports</text>
  <path d="M 550 122 V 154" fill="none" stroke="var(--chart-teal, #226b63)" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#rd4-rn-teal)" />
  <polygon points="550.0,122.0 544.825,132.005 555.175,132.005" fill="var(--chart-teal, #226b63)" />
  <rect x="416" y="158" width="267" height="56" rx="7" fill="var(--surface-card, #ffffff)" stroke="var(--figure-line, #abb8c4)" stroke-width="1.6" />
  <text x="549.5" y="184.0" fill="var(--text-primary, #233442)" text-anchor="middle" font-size="18" font-weight="620" class="v-ink">System AXI crossbar</text>
  <text x="549.5" y="204.0" fill="var(--text-secondary, #435669)" text-anchor="middle" font-size="14" font-weight="450" class="v-sub">Address selects the target</text>
  <path d="M 550 217 V 235" fill="none" stroke="var(--chart-teal, #226b63)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="550.0,217.0 545.05,226.57 554.95,226.57" fill="var(--chart-teal, #226b63)" />
  <path d="M 449 246 V 235 H 652 V 246" fill="none" stroke="var(--chart-teal, #226b63)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 449 268 V 279" fill="none" stroke="var(--chart-teal, #226b63)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#rd4-rn-teal)" />
  <path d="M 652 268 V 279" fill="none" stroke="var(--chart-teal, #226b63)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#rd4-rn-teal)" />
  <text x="449" y="262" fill="var(--chart-teal, #226b63)" text-anchor="middle" font-size="15" font-weight="570">Host address</text>
  <text x="651" y="262" fill="var(--chart-teal, #226b63)" text-anchor="middle" font-size="15" font-weight="570">Card address</text>
  <rect x="363" y="282" width="172" height="69" rx="7" fill="var(--surface-card, #ffffff)" stroke="var(--figure-line, #abb8c4)" stroke-width="1.6" />
  <text x="449.0" y="314.5" fill="var(--text-primary, #233442)" text-anchor="middle" font-size="16.3" font-weight="620" class="v-ink">QDMA AXI bridge</text>
  <text x="449.0" y="334.5" fill="var(--text-secondary, #435669)" text-anchor="middle" font-size="14" font-weight="450" class="v-sub">PCIe-facing AXI port</text>
  <rect x="562" y="282" width="176" height="69" rx="7" fill="var(--surface-card, #ffffff)" stroke="var(--figure-line, #abb8c4)" stroke-width="1.6" />
