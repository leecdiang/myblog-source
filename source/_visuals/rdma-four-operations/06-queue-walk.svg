<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" role="img" aria-label="How one 4 KiB SEND uses a host-backed send queue, two local scatter-gather elements, PCIe DMA and a completion queue" font-family="system-ui, sans-serif">
<title>One SEND, two local buffers, one completion</title>
<desc>Host A posts one signaled, non-inline RC SEND. SGE zero describes one KiB at P; SGE one describes three KiB at P plus 8192. Both lie inside one registered twelve-KiB range and use local key K. On a host-backed queue fetch path, software publishes the work entry and rings a doorbell. The NIC uses QP state, fetches the WQE, checks the local key and ranges, gathers the two payload slices in order and sends one message to the peer. PCIe read requests point from NIC to host while returned bytes point from host to NIC. After the signaled send completes, the NIC writes a local completion entry. Logical accesses only. Descriptor encodings, caches, batching and physical transactions are implementation specific.</desc>
