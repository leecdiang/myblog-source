<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 409" role="img" aria-label="Two-rank tensor parallel MLP with column and row weight sharding" font-family="system-ui, sans-serif">
  <title>Tensor parallelism in a two-projection MLP</title>
  <desc>The first matrix W1 is split into two column shards and the second matrix W2 into two row shards. Each rank holds the same input X, computes and activates its own intermediate columns, and projects those columns into a partial output of the full output shape. AllReduce sums the two partial outputs and returns Y to both ranks.</desc>
  <defs>
    <marker id="llm-04-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="var(--text-secondary)"/>
    </marker>
  </defs>
  <g fill="var(--text-primary)" font-weight="650" font-size="20">
    <text x="25" y="36">Weight layout</text>
    <text x="25" y="185">Forward pass</text>
  </g>
  <path d="M25 158H735" fill="none" stroke="var(--divider)" stroke-width="2"/>
  <g fill="var(--text-secondary)" font-size="17" font-weight="550">
    <text x="25" y="70">W₁  ·  H × F  ·  column split</text>
    <text x="400" y="70">W₂  ·  F × H  ·  row split</text>
  </g>
  <g fill="var(--chart-blue)" fill-opacity=".12" stroke="var(--chart-blue)" stroke-width="1.2">
    <rect x="25" y="85" width="155" height="54" rx="4"/>
    <rect x="400" y="85" width="310" height="27" rx="4"/>
    <rect x="168" y="208" width="149" height="60" rx="6"/>
    <rect x="349" y="208" width="148" height="60" rx="6"/>
  </g>
  <g fill="var(--chart-teal)" fill-opacity=".12" stroke="var(--chart-teal)" stroke-width="1.2">
    <rect x="180" y="85" width="155" height="54" rx="4"/>
    <rect x="400" y="112" width="310" height="27" rx="4"/>
    <rect x="168" y="290" width="149" height="60" rx="6"/>
    <rect x="349" y="290" width="148" height="60" rx="6"/>
  </g>
  <rect x="25" y="249" width="91" height="60" rx="6" fill="var(--surface-card)" stroke="var(--border-subtle)" stroke-width="1.5"/>
  <rect x="564" y="241" width="171" height="76" rx="6" fill="var(--chart-amber)" fill-opacity=".12" stroke="var(--chart-amber)" stroke-width="1.3"/>
  <g fill="none" stroke="var(--text-secondary)" stroke-width="1.5">
    <path d="M116 279H142V238H166" marker-end="url(#llm-04-arrow)"/>
    <path d="M142 279V320H166" marker-end="url(#llm-04-arrow)"/>
    <path d="M317 238H347 M317 320H347" marker-end="url(#llm-04-arrow)"/>
    <path d="M497 238H529V259H562" marker-end="url(#llm-04-arrow)"/>
    <path d="M497 320H529V299H562" marker-end="url(#llm-04-arrow)"/>
  </g>
  <g fill="var(--text-primary)" text-anchor="middle" font-size="17" font-weight="550">
    <text x="102" y="117">Rank 0</text>
    <text x="257" y="117">Rank 1</text>
    <text x="555" y="105">Rank 0</text>
    <text x="555" y="132">Rank 1</text>
    <text x="70" y="273">Input X</text>
    <text x="242" y="232">A₀ = φ(XW₁⁰)</text>
    <text x="423" y="232">U₀ = A₀W₂⁰</text>
    <text x="242" y="314">A₁ = φ(XW₁¹)</text>
    <text x="423" y="314">U₁ = A₁W₂¹</text>
    <text x="649" y="285">Y = U₀ + U₁</text>
  </g>
  <g fill="var(--text-secondary)" text-anchor="middle" font-size="15">
    <text x="70" y="294">T × H</text>
    <text x="242" y="254">T × (F/2)</text>
    <text x="423" y="254">T × H</text>
    <text x="242" y="336">T × (F/2)</text>
    <text x="423" y="336">T × H</text>
    <text x="649" y="307">T × H on both ranks</text>
  </g>
  <text x="649" y="263" fill="var(--chart-amber)" text-anchor="middle" font-size="16" font-weight="650">AllReduce</text>
  <text x="380" y="390" fill="var(--text-secondary)" text-anchor="middle" font-size="16">T tokens · H hidden width · F intermediate width</text>
</svg>
